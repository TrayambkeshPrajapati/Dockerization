version: '3.8'

services:
  app:
    build: .
    container_name: todo-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/todo_db
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: todo-mongodb
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data: